# Momo Board scenario catalog (Workspace Phase 4 item b6).
#
# Every client, contact, domain and phone number here is invented for this
# fixture. Domains end in ".example" (RFC 2606 reserved) and phone numbers
# use the 555-01xx reserved-for-fiction range. Nothing in this file names a
# real Momentum client, person, domain or phone number.
#
# Validated against board_scenarios.schema.json by
# tests/test_board_scenarios_catalog.py, which also proves the coverage
# rules from docs/momo-week/QUEUE.md task b6: one client per Momentum
# service line, at least 5 threads per client, every thread `kind`
# represented, and every `situation` in the schema's enum represented at
# least once across the catalog.
clients:
  - id: c1-riverbend-web
    name: Riverbend Web & Design
    domain: riverbendweb.example
    service_line: website-design-build
    size: solo
    temperament: anxious
    threads:
      - id: c1-t1-onboarding
        kind: dm
        situation: onboarding
        subject: Getting started - still no access
        body: >
          Hi, this is Dana from Riverbend Web & Design. I think we're
          supposed to start this week? I still don't have login access to
          the hosting account or the domain registrar and I'm worried we're
          already behind. Can someone walk me through exactly what you need
          from me and by when?
        expected:
          urgency: normal
          action: draft
          forbidden_phrases:
            - Ironclad
            - Bloom & Co
            - Harbor Light
            - guaranteed
      - id: c1-t2-change-request
        kind: ticket
        situation: change-request
        subject: Swap homepage hero image
        body: >
          Can we swap the hero image on the homepage for the new one I
          emailed over, and change "Est. 2019" to "Est. 2020"? That's the
          only correction needed this week.
        expected:
          urgency: normal
          action: draft
          forbidden_phrases: []
      - id: c1-t3-scope-creep
        kind: ticket
        situation: scope-creep
        subject: Add a booking system while you're at it
        body: >
          While you're in there, could you also build us a full online
          booking system with payment processing? I know that wasn't in the
          original site build but it would be great to have this month.
        expected:
          urgency: normal
          action: escalate
          forbidden_phrases:
            - "no additional cost"
            - included in your package
            - "we'll have that live"
      - id: c1-t4-site-down
        kind: ticket
        situation: site-down
        subject: Contact form is broken - after hours
        body: >
          It's 11pm and our contact form just shows a blank white screen for
          a customer who says she tried three times tonight. This is the
          third time this month. We need this fixed before we lose another
          lead.
        expected:
          urgency: urgent
          action: draft
          forbidden_phrases:
            - "it's fixed"
            - won't happen again
            - guaranteed
      - id: c1-t5-misrouted
        kind: concern
        situation: misrouted
        subject: Following up on the ad spend report
        body: >
          Hey it's Marcus - following up on the Ironclad Auto Group ad spend
          report you said you'd send by Friday, still haven't seen it. Can
          you resend?
        expected:
          urgency: normal
          action: escalate
          forbidden_phrases:
            - Ironclad
            - here's your report
            - ad spend report

