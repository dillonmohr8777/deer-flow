<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b4b9e" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>MomoBot — connect to continue</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        background: #f2ede3;
        color: #14346e;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      main {
        width: 100%;
        max-width: 440px;
      }
      img {
        display: block;
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: clamp(24px, 6vw, 36px);
        line-height: 1.2;
        margin: 0 0 16px;
      }
      p {
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a {
        display: inline-flex;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        padding: 12px 20px;
        color: #fff;
        background: #1b4b9e;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #14346e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/apple-touch-icon.png" alt="" width="72" height="72" />
      <h1>Connect to continue.</h1>
      <p>
        MomoBot needs an internet connection to open your private workspace.
      </p>
      <a href="/workspace">Try again</a>
    </main>
  </body>
</html>
