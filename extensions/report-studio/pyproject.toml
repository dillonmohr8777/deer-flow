[project]
name = "deerflow-report-studio"
version = "0.1.0"
description = "Build a client's weekly report page and deploy only that page after approval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-extension-api>=0.2,<0.3",
    "httpx>=0.28,<1",
    "langchain>=1.3,<2",
]

[project.entry-points."deerflow.extensions"]
report-studio = "deerflow_report_studio:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_report_studio"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["deerflow_report_studio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
