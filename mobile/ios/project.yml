name: MomoBot
options:
  bundleIdPrefix: com.dillonmohr
  deploymentTarget:
    iOS: "17.0"
packages:
  MomoMobileCore:
    path: MomoMobileCore
targets:
  MomoBot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: MomoMobileCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MomoBot
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        MomoBotWorkspaceURL: $(MOMOBOT_WORKSPACE_URL)
        NSFaceIDUsageDescription: Unlock your private MomoBot workspace.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: 1.0
        MOMOBOT_WORKSPACE_URL: https://momobot.needmomentum.com/workspace
        PRODUCT_BUNDLE_IDENTIFIER: com.dillonmohr.momobot
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
