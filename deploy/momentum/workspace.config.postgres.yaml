# Postgres-backend variant of workspace.config.yaml -- identical except for
# the `database:` block. Used with compose.postgres.yaml for a Postgres
# rehearsal or cutover; keep every other key in sync with workspace.config.yaml
# (test_momentum_postgres_rehearsal.py fails the build if they drift).
