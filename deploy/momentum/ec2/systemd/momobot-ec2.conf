# Drop-in for the Lightsail kit's units on EC2 (install.sh installs it as <unit>.service.d/ec2.conf).
# The env file lives on tmpfs, so the kit's "/opt/momobot/.env exists" condition is replaced.
[Unit]
ConditionPathExists=
ConditionPathExists=/opt/momobot/config.yaml
ConditionPathExists=/opt/momobot/settings.env

[Service]
Environment=MOMOBOT_ENV_FILE=/run/momobot/.env
Environment=MOMOBOT_EXTRA_COMPOSE=/opt/momobot/src/deploy/momentum/ec2/compose.ec2.yaml
