# EC2 layer on top of the Lightsail kit's layers (lightsail/up.sh adds it via MOMOBOT_EXTRA_COMPOSE).
# Gives the gateway the same extra mounts the Mac stack had from ops/compose.admission-20261005.yaml,
# with the Mac paths replaced by /opt/momobot. Brain and client_browser MCP stay off in the cloud
# extensions_config: both call services that only run on the Mac.
services:
  frontend:
    volumes:
      # Private staff portraits survive image rebuilds and use the existing brand backup.
      - /opt/momobot/data/brand/daily-people:/app/frontend/public/momentum/daily/people:ro
  gateway:
    environment:
      - MOMO_ADMISSION_DIR=/var/momo-admission
      - MOMO_LOBBY_NOTES_DIR=/var/momo-lobby-notes
      # Per-person onboarding profiles (<email>.md), built outside Git. Empty folder = no pre-fill.
      - MOMO_PEOPLE_DIR=/var/momo-people
      # The base compose sets GITHUB_TOKEN from GITHUB_PERSONAL_ACCESS_TOKEN (unset here), which would blank it.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - /opt/momobot/data/skills:/app/skills:ro
      - /opt/momobot/data/admission:/var/momo-admission
      - /opt/momobot/data/lobby-notes:/var/momo-lobby-notes:ro
      - /opt/momobot/data/people:/var/momo-people:ro
      - /opt/momobot/data/brand:/var/momobot-brand:ro
      - /opt/momobot/data/evals:/app/backend/.deer-flow/agency-evals:ro
      - /opt/momobot/code/momo_guard.py:/app/backend/packages/harness/deerflow/community/browser_automation/momo_guard.py:ro
      - /opt/momobot/code/momo_protocol.py:/app/backend/packages/harness/deerflow/community/browser_automation/momo_protocol.py:ro
      # Placement extension from a pinned git worktree (README "Operator extensions"). Inert until a
      # plugins: entry in /opt/momobot/config.yaml names it. A missing source fails the start.
      - type: bind
        source: /opt/momobot/extensions/placement/examples/vhin-placement/vhin_placement
        target: /app/backend/vhin_placement
        read_only: true
        bind:
          create_host_path: false
