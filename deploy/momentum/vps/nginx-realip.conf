# Included into nginx's http{} block by compose.public.yaml (f23, VPS half).
#
# Caddy terminates TLS for the public internet and reverse-proxies to
# nginx:2026 over the compose network. Caddy's own reverse_proxy sets (never
# appends) X-Forwarded-For to the address of the connection it received --
# the real internet client, since nothing sits in front of Caddy. Trust
# X-Forwarded-For only from Caddy's fixed container address, so $remote_addr
# (and the X-Real-IP nginx forwards to the Gateway) becomes the real client
# and each client gets its own login rate-limit bucket instead of every
# internet visitor sharing Caddy's one bucket.
set_real_ip_from 172.30.27.5;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
