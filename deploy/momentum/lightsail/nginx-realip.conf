# Included into nginx's http{} block by ../mac/compose.funnel.yaml.
# Caddy (172.30.26.20, see compose.caddy-ip.yaml) is the only public listener
# and SETS X-Forwarded-For to the real client, so trust it from that one
# address only. Each client then gets its own login rate-limit bucket.
set_real_ip_from 172.30.26.20;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
