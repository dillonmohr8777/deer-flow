# Included into nginx's http{} block by mac/compose.funnel.yaml (f23), PC host version.
#
# On the PC the client of tailscaled is the GCE Caddy front VM, so tailscaled
# SETS X-Forwarded-For to the front VM's address for every public request and
# that header cannot identify users. Caddy instead sends the real client in
# X-Real-IP (header_up X-Real-IP {remote_host}), which tailscaled leaves alone.
# Host-to-container connections reach nginx from the compose network gateway,
# so trust X-Real-IP only from that one address.
#
# Only valid while the origin is reachable solely through the front: the PC publishes
# the origin with tailnet-only `tailscale serve` (NEVER `tailscale funnel`), the front
# VM is on the tailnet, and the tailnet ACL lets only the front VM reach the PC on
# :8443 (see README.md, "Origin exposure"). Direct callers arrive through the same
# gateway address and could forge X-Real-IP to dodge the login limiter, so if the
# origin is ever public again, delete the three lines below first.
set_real_ip_from 172.30.26.1;
real_ip_header X-Real-IP;
real_ip_recursive off;
