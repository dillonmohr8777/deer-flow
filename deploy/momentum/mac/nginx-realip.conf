# Included into nginx's http{} block by compose.funnel.yaml (f23).
#
# Tailscale Funnel terminates TLS in tailscaled on the Mac and proxies to
# 127.0.0.1:2026. Its reverse proxy SETS (never appends) X-Forwarded-For to
# the real client address, and every host-to-container connection reaches
# nginx from the compose network's gateway address. Trust X-Forwarded-For only
# from that one address, so $remote_addr (and the X-Real-IP nginx forwards to
# the Gateway) becomes the real client and each client gets its own login
# rate-limit bucket instead of all internet users sharing one.
#
# f93(b): this address is trusted for ANY host-originated connection, not
# only tailscaled's -- nginx cannot tell the two apart. The one other thing
# on this Mac that could reach a host-bound port is a per-thread agent
# sandbox (Docker-outside-of-Docker, ../../docker/docker-compose.dood.yaml),
# via host.docker.internal. That path is closed as long as
# workspace.config.yaml's sandbox.network.mode stays "isolated" or
# "allowlist": both put the sandbox's own network on an
# internal-only bridge (no route to the host at all) and force egress
# through a separate, domain-allowlisted proxy network that nginx is not
# part of (see AioSandboxLocalBackend._network_policy_digest). It would
# reopen if sandbox.network.mode were ever set to "open" on a
# publicly-reachable deployment like this one -- "open" sandboxes get normal
# host/bridge networking and could reach host.docker.internal directly.
set_real_ip_from 172.30.26.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
