name: MomoBot desktop release

# Pushing a momobot-desktop-vX.Y.Z tag is the release: this builds, tests and
# smoke-checks the app on Apple Silicon, then publishes it as the latest GitHub
# release. Installed apps read releases/latest/download/release.json and offer
# the update, so only push the tag once the change is approved to ship.
on:
  push:
    tags:
      - 'momobot-desktop-v*'

permissions:
  contents: write

concurrency:
  group: momobot-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Tag must match package version
        run: test "${GITHUB_REF_NAME#momobot-desktop-v}" = "$(node -p "require('./package.json').version")"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint and tests
        run: npm run check && npm test
      - name: Package (ad-hoc signed, secret-scanned)
        run: MOMOBOT_RELEASE_DIR="$RUNNER_TEMP/release" npm run package:mac
      - name: Hidden launch smoke of the packaged app
        run: |
          build=$(ls -d "$RUNNER_TEMP"/release/build-*)
          app=$(node -p "require('$build/build-paths.json').appPath")
          "$app/Contents/MacOS/MomoBot" --smoke-test | tee "$RUNNER_TEMP/smoke.json"
          grep -q '"passed":true' "$RUNNER_TEMP/smoke.json"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(ls -d "$RUNNER_TEMP"/release/build-*)
          version="${GITHUB_REF_NAME#momobot-desktop-v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          {
            echo "MomoBot desktop $version for Apple Silicon Macs (ad-hoc signed, not notarized)."
            echo
            echo "Install or update: \`curl -fsSL $base/install.sh | sh -s -- $base\`"
            echo
            echo '```'
            cat "$build/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --latest --title "MomoBot desktop $version" --notes-file "$RUNNER_TEMP/notes.md" \
            "$build/MomoBot-mac-arm64.zip" "$build/MomoBot-mac-arm64.dmg" "$build/SHA256SUMS" "$build/release.json" "$build/install.sh"
